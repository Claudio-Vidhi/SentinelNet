! Configurazione Cisco IOS XE deliberatamente non conforme.
! Indirizzi da RFC 5737 (documentazione), nessun dato reale.
version 17.3
service timestamps debug uptime
service timestamps log uptime
no service password-encryption
no aaa new-model
!
hostname Router
!
enable password cisco123
username admin privilege 15 password 0 cisco123
username backup privilege 15 password 0 backup123
!
no ip domain-name
ip ssh version 1
ip ssh time-out 120
ip ssh authentication-retries 5
ip source-route
cdp run
service dhcp
service pad
!
interface GigabitEthernet0/0
 description internet
 ip address 192.0.2.1 255.255.255.0
!
interface Tunnel0
 description tunnel non documentato
 ip address 198.51.100.254 255.255.255.252
 tunnel source GigabitEthernet0/0
 tunnel destination 203.0.113.9
!
line con 0
 exec-timeout 0 0
line aux 0
 exec-timeout 0 0
line vty 0 4
 exec-timeout 60 0
 transport input telnet ssh
line vty 5 15
 transport input all
!
logging console debugging
logging trap emergencies
!
snmp-server community public RO
snmp-server community private RW
snmp-server group v2grp v1
!
end
