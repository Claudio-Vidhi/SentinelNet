#config-version=FGT100F-7.4.1
config system global
    set hostname "sentinel-lab-01"
    set timezone 27
    set admintimeout 5
    set admin-sport 8443
    set admin-ssh-port 2222
    set admin-lockout-threshold 3
    set admin-lockout-duration 900
    set admin-https-redirect enable
    set pre-login-banner enable
    set post-login-banner enable
    set ssl-min-proto-version TLSv1-2
    set ssl-static-key-ciphers disable
    set strong-crypto enable
    set log-single-cpu-high enable
    set gui-display-hostname disable
end
config system dns
    set primary 192.0.2.53
    set secondary 198.51.100.53
end
config system ntp
    set ntpsync enable
    set type custom
    set syncinterval 60
    config ntpserver
        edit 1
            set server "192.0.2.123"
        next
        edit 2
            set server "198.51.100.123"
        next
    end
end
config system auto-install
    set auto-install-config disable
    set auto-install-image disable
end
config system interface
    edit "port1"
        set role wan
        set allowaccess ping
    next
    edit "port2"
        set role lan
        set allowaccess ping https ssh
    next
end
config system zone
    edit "internal"
        set intrazone deny
        set interface "port2"
    next
end
config system ha
    set mode a-p
    set group-name "SN-CLUSTER"
    set monitor "port1" "port2"
end
config system admin
    edit "mario.rossi"
        set trusthost1 10.0.1.0 255.255.255.0
    next
end
config system password-policy
    set status enable
    set apply-to admin-password
    set minimum-length 14
    set min-lower-case-letter 1
    set min-upper-case-letter 1
    set min-non-alphanumeric 1
    set min-number 1
    set expire-status enable
    set expire-day 90
end
config system snmp community
    edit 1
        set name "sn-monitor-v3"
        set status disable
    next
end
config system snmp user
    edit "sn-monitor"
        set security-level auth-priv
        set auth-proto sha256
        set priv-proto aes256
    next
end
config firewall local-in-policy
    edit 1
        set intf "port1"
        set srcaddr "mgmt-nets"
        set dstaddr "all"
        set service "HTTPS" "SSH"
        set action accept
        set schedule "always"
    next
end
config firewall policy
    edit 1
        set name "lan-to-internet"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "lan-users"
        set dstaddr "all"
        set service "HTTPS"
        set action accept
        set schedule "always"
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set logtraffic all
        set comments "Navigazione utenti LAN - richiesta CHG-0001"
    next
end
config vpn ssl settings
    set servercert "sn-portal-cert"
    set ssl-min-proto-ver tls1-2
    set source-address "mgmt-nets"
end
config log syslogd setting
    set status enable
    set server "10.0.1.100"
    set port 5514
    set enc-algorithm high
end
config log eventfilter
    set event enable
end
config log disk setting
    set status enable
end
