! Configurazione Cisco IOS XE di riferimento: conforme al CIS 17.x Benchmark.
! Indirizzi da RFC 5737 (documentazione), nessun dato reale.
version 17.9
service timestamps debug datetime msec show-timezone
service timestamps log datetime msec show-timezone
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
no service dhcp
!
hostname switch-01
!
banner login ^C
Accesso riservato al personale autorizzato.
^C
banner motd ^C
Ogni attivita' su questo sistema e' registrata.
^C
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa accounting commands 15 default start-stop group tacacs+
!
enable secret 9 $9$EXAMPLEHASHEXAMPLEHASHEXAMPLEHASH
username netops secret 9 $9$EXAMPLEHASHEXAMPLEHASHEXAMPLEHASH
username monitor secret 9 $9$EXAMPLEHASHEXAMPLEHASHEXAMPLEHASH
!
ip domain-name example.com
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
no ip source-route
no cdp run
no ip http server
no ip http secure-server
!
crypto pki certificate chain TP-self-signed-1
 certificate self-signed 01
  30820330 308202D9 A0030201 02020101 300D0609 2A864886
  no cdp run
  transport input telnet
  quit
!
interface GigabitEthernet1/0/1
 description uplink
 ip address 192.0.2.1 255.255.255.0
 no ip proxy-arp
!
interface Vlan10
 description utenti
 ip address 198.51.100.1 255.255.255.0
 no ip proxy-arp
!
line con 0
 exec-timeout 9 0
 login authentication default
line aux 0
 no exec
line vty 0 4
 access-class MGMT-IN in
 exec-timeout 10 0
 transport input ssh
line vty 5 15
 access-class MGMT-IN in
 exec-timeout 10 0
 transport input ssh
!
logging buffered 64000
logging console critical
logging trap informational
logging source-interface Loopback0
logging host 192.0.2.50
login on-failure log
login on-success log
!
ntp authenticate
ntp authentication-key 1 md5 EXAMPLEKEY
ntp trusted-key 1
ntp server 192.0.2.123 key 1
ntp server 198.51.100.123 key 1
!
snmp-server community sn-monitor RO SNMP-IN
snmp-server group sn-v3 v3 priv
snmp-server user sn-reader sn-v3 v3 auth sha EXAMPLEAUTH priv aes 256 EXAMPLEPRIV
!
end
