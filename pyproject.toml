[project]
name = "sentinelnet"
version = "0.35.4"
description = "Self-hosted network management, observability, backup automation and vulnerability intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.1.0",
    "cryptography>=42.0.0",
    # fastapi 0.141 introduces lazy routing (_IncludedRouter), which breaks
    # the app.routes introspection the route-contract tests rely on;
    # verified green with 0.136.x on Python 3.11 and 3.14 alike.
    "fastapi>=0.110.0,<0.141",
    "ncclient>=0.6.15",
    "netmiko>=4.3.0",
    "paramiko>=3.4.0",
    "pydantic>=2.6.0",
    "pyjwt>=2.8.0",
    # switch_provisioner drives the console port over pyserial: without it a
    # `uv sync` environment imports the module and dies on the serial push,
    # while the Docker image (requirements.txt) worked. Runtime, not dev.
    "pyserial>=3.5",
    "pysnmp>=7.1.27",
    "python-docx>=1.2.0",
    "requests>=2.31.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    # Gate tooling from AGENTS.md / docs/development.md: declared here so a
    # plain `uv sync` no longer prunes them (they were env-only before).
    "graphifyy>=0.9.55",
    # fastapi.testclient (starlette) imports httpx at runtime: without it
    # the TestClient-based tests do not start after a `uv sync`. starlette 1.x
    # asks for httpx2 and warns on every run when it finds only httpx; both
    # are declared so the warning goes away without losing the fallback.
    "httpx>=0.28.0",
    "httpx2>=2.12.0",
    # scripts/build.ps1, CONTRIBUTING.md e il PR template dicono tutti
    # `uv run pyinstaller SentinelNet.spec`, ma il pacchetto non era dichiarato:
    # dopo un `uv sync` quel comando non esisteva. Stesso motivo di graphifyy
    # e pyrefly qui sopra -- se un gate lo invoca, va dichiarato.
    "pyinstaller>=6.0.0",
    "pyrefly>=1.2.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
]

[tool.pytest.ini_options]
# xdist di default e' --dist load: distribuisce i SINGOLI test, quindi i test di
# moduli diversi si alternano sullo stesso worker. Ventuno moduli cancellano
# observability.db nel proprio setUpClass, e con l'alternanza quella cancellazione
# cade IN MEZZO ai test di un altro modulo, che si ritrova le proprie righe
# sparite: un fallimento ogni tot run, su test diversi ogni volta e mai in
# isolamento.
#
# loadfile tiene ogni file su un worker solo. Lo stato a livello di modulo resta
# condiviso (conftest.py spiega perche' e' voluto), ma smette di intrecciarsi.
addopts = "--dist loadfile"

[tool.pyrefly]
project-includes = [
    "**/*.py",
]
project-excludes = [
    ".venv/**",
    "build/**",
    "dist/**",
    "**/*.ipynb",
    "tests/**",
    "C:/__pyrefly_virtual__/**",
    "**/__pyrefly_virtual__/**",
]
