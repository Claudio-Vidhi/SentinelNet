name: Bug report
description: Something behaves differently from what the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste device credentials, tokens, backup configs or the contents
        of `data/`. Redact hostnames and public IPs you do not want indexed.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with an empty SENTINELNET_DATA_DIR
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: From `GET /api/version`, or the tag/commit you built.
      placeholder: "0.24.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How are you running it
      options:
        - Docker (docker compose)
        - Docker (published image)
        - From source (python app_server.py)
        - Windows exe (PyInstaller)
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and Python version
      placeholder: "Debian 12, Python 3.11.15 — or: Windows 11, Python 3.14.6"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        From `error_log.txt` in your data directory, or the console. Redact
        before pasting — it is rendered as a code block, not escaped.
      render: text

  - type: textarea
    id: devices
    attributes:
      label: Devices involved
      description: >
        Vendor and model only if the bug touches a driver, a collector or a
        backup. Skip it otherwise.
